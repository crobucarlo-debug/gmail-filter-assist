
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172554">
  <title>Gmail Filter Assist</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9; color: #172033;
    }
    main { max-width: 650px; margin: auto; }
    header {
      background: #172554; color: white;
      padding: 24px; border-radius: 18px;
      margin-bottom: 20px;
    }
    h1 { margin: 0 0 8px; font-size: 25px; }
    header p { margin: 0; color: #dbeafe; }
    section {
      background: white; padding: 20px;
      border-radius: 16px; margin-bottom: 16px;
      box-shadow: 0 2px 8px #0000000b;
    }
    h2 { font-size: 19px; margin: 0 0 16px; }
    label { display: block; font-weight: bold; margin: 14px 0 6px; }
    input, button {
      width: 100%; padding: 13px;
      border-radius: 9px; font-size: 16px;
    }
    input { border: 1px solid #cbd5e1; }
    button {
      border: 0; background: #2563eb;
      color: white; font-weight: bold;
      margin-top: 14px; cursor: pointer;
    }
    button.secondary { background: #475569; }
    button.danger { background: #dc2626; width: auto; padding: 9px 12px; }
    .check { display: flex; align-items: center; gap: 10px; font-weight: normal; }
    .check input { width: 19px; height: 19px; }
    .filter {
      border: 1px solid #e2e8f0; border-radius: 10px;
      padding: 13px; margin: 10px 0;
    }
    .filter p { margin: 5px 0; overflow-wrap: anywhere; }
    #status { white-space: pre-wrap; color: #334155; font-size: 14px; }
    .muted { color: #64748b; font-size: 13px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Gmail Filter Assist</h1>
    <p>Gestisci i tuoi filtri Gmail in modo semplice.</p>
  </header>

  <section>
    <h2>Account Gmail</h2>
    <p id="account" class="muted">Non collegato</p>
    <button id="connect">Collega Gmail</button>
    <button id="disconnect" class="secondary" hidden>Disconnetti</button>
  </section>

  <section id="manager" hidden>
    <h2>Crea un nuovo filtro</h2>
    <form id="filterForm">
      <label for="from">Mittente</label>
      <input id="from" type="text" placeholder="es. newsletter@azienda.it">

      <label for="to">Destinatario</label>
      <input id="to" type="text" placeholder="es. nome@gmail.com">

      <label for="subject">Oggetto contiene</label>
      <input id="subject" type="text" placeholder="es. Fattura">

      <label class="check">
        <input id="archive" type="checkbox">
        Archivia automaticamente (salta Posta in arrivo)
      </label>
      <label class="check">
        <input id="read" type="checkbox">
        Contrassegna come già letto
      </label>
      <label class="check">
        <input id="star" type="checkbox">
        Aggiungi una stella
      </label>

      <button type="submit">Crea filtro</button>
    </form>
  </section>

  <section id="filtersSection" hidden>
    <h2>I tuoi filtri</h2>
    <button id="refresh" class="secondary">Aggiorna elenco</button>
    <div id="filters"></div>
  </section>

  <section>
    <p id="status">Pronto per il collegamento.</p>
    <p class="muted">L'app opera sul tuo account Google solo dopo la tua autorizzazione. Non memorizza le email.</p>
  </section>
</main>

<script>
const CLIENT_ID = "209995061533-4j5fngbntbavl36b74nft39e25r7777h.apps.googleusercontent.com";
const SCOPE = "https://www.googleapis.com/auth/gmail.settings.basic";

let accessToken = null;
let tokenClient = null;

const $ = id => document.getElementById(id);
const status = message => $("status").textContent = message;

function initGoogle() {
  if (!window.google?.accounts?.oauth2) {
    status("Caricamento del servizio Google in corso. Riprova tra qualche secondo.");
    return false;
  }
  if (!tokenClient) {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPE,
      callback: async response => {
        if (response.error) {
          status("Accesso non riuscito: " + response.error);
          return;
        }
        accessToken = response.access_token;
        $("account").textContent = "Account Google collegato";
        $("connect").hidden = true;
        $("disconnect").hidden = false;
        $("manager").hidden = false;
        $("filtersSection").hidden = false;
        status("Collegamento riuscito!");
        await loadFilters();
      }
    });
  }
  return true;
}

$("connect").addEventListener("click", () => {
  if (initGoogle()) tokenClient.requestAccessToken();
});

$("disconnect").addEventListener("click", () => {
  if (accessToken && window.google?.accounts?.oauth2) {
    google.accounts.oauth2.revoke(accessToken);
  }
  accessToken = null;
  tokenClient = null;
  $("account").textContent = "Non collegato";
  $("connect").hidden = false;
  $("disconnect").hidden = true;
  $("manager").hidden = true;
  $("filtersSection").hidden = true;
  $("filters").replaceChildren();
  status("Account scollegato.");
});

async function gmailRequest(path, options = {}) {
  const response = await fetch(
    "https://gmail.googleapis.com/gmail/v1/users/me/" + path,
    {
      ...options,
      headers: {
        "Authorization": "Bearer " + accessToken,
        "Content-Type": "application/json",
        ...options.headers
      }
    }
  );
  const data = await response.json();
  if (!response.ok) {
    throw new Error(data.error?.message || "Errore Gmail API");
  }
  return data;
}

async function loadFilters() {
  try {
    status("Caricamento filtri...");
    const data = await gmailRequest("settings/filters");
    const container = $("filters");
    container.replaceChildren();

    if (!data.filter?.length) {
      container.textContent = "Non hai ancora creato filtri.";
    } else {
      data.filter.forEach(filter => {
        const card = document.createElement("div");
        card.className = "filter";

        const criteria = filter.criteria || {};
        const action = filter.action || {};
        const details = [
          ["Da", criteria.from],
          ["A", criteria.to],
          ["Oggetto", criteria.subject],
          ["Contiene", criteria.query]
        ];

        details.forEach(([label, value]) => {
          if (value) {
            const p = document.createElement("p");
            p.textContent = label + ": " + value;
            card.appendChild(p);
          }
        });

        const actions = [];
        if (action.removeLabelIds?.includes("INBOX")) actions.push("Archivia");
        if (action.removeLabelIds?.includes("UNREAD")) actions.push("Segna come letto");
        if (action.addLabelIds?.includes("STARRED")) actions.push("Aggiungi stella");

        const p = document.createElement("p");
        p.className = "muted";
        p.textContent = "Azioni: " + (actions.join(", ") || "Altre azioni");
        card.appendChild(p);

        const button = document.createElement("button");
        button.className = "danger";
        button.textContent = "Elimina filtro";
        button.addEventListener("click", async () => {
          if (!confirm("Vuoi davvero eliminare questo filtro?")) return;
          try {
            await gmailRequest("settings/filters/" + encodeURIComponent(filter.id), {
              method: "DELETE"
            });
            status("Filtro eliminato.");
            await loadFilters();
          } catch (error) {
            status("Errore: " + error.message);
          }
        });
        card.appendChild(button);
        container.appendChild(card);
      });
    }
    status("Filtri caricati: " + (data.filter?.length || 0));
  } catch (error) {
    status("Errore nel caricamento: " + error.message);
  }
}

$("filterForm").addEventListener("submit", async event => {
  event.preventDefault();

  const criteria = {};
  const from = $("from").value.trim();
  const to = $("to").value.trim();
  const subject = $("subject").value.trim();

  if (from) criteria.from = from;
  if (to) criteria.to = to;
  if (subject) criteria.subject = subject;

  if (!Object.keys(criteria).length) {
    status("Inserisci almeno un criterio: mittente, destinatario o oggetto.");
    return;
  }

  const action = {};
  const addLabelIds = [];
  const removeLabelIds = [];

  if ($("star").checked) addLabelIds.push("STARRED");
  if ($("archive").checked) removeLabelIds.push("INBOX");
  if ($("read").checked) removeLabelIds.push("UNREAD");

  if (addLabelIds.length) action.addLabelIds = addLabelIds;
  if (removeLabelIds.length) action.removeLabelIds = removeLabelIds;

  try {
    status("Creazione del filtro...");
    await gmailRequest("settings/filters", {
      method: "POST",
      body: JSON.stringify({ criteria, action })
    });
    $("filterForm").reset();
    status("Filtro creato correttamente!");
    await loadFilters();
  } catch (error) {
    status("Errore nella creazione: " + error.message);
  }
});

$("refresh").addEventListener("click", loadFilters);
</script>
</body>
</html>
